# Pubblica il sito statico su GitHub Pages a ogni push su main.
#
# Il frontend è puro statico (Next output: 'export'): questo workflow NON tocca
# il database né le Edge Functions — quelli si aggiornano a parte con
# scripts/deploy-supabase.sh. Vedi il README.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione per volta; annulla quelle in coda superate.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build statica
        run: npm run build
        env:
          # Segreti/variabili del repo (Settings → Secrets and variables → Actions).
          # NB: solo variabili PUBBLICHE (anon key). MAI la service_role key qui.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # In produzione la modalità demo è SEMPRE spenta: niente selettore, niente seed.
          NEXT_PUBLIC_DEMO: "false"
          # Sottocartella della "project page": il repo è tiptopmixt.github.io/senti-.
          # (Se un domani usi un dominio custom, rimetti "" o la variabile del repo.)
          NEXT_PUBLIC_BASE_PATH: "/senti-"
          NEXT_PUBLIC_MAP_TILES_URL: ${{ vars.NEXT_PUBLIC_MAP_TILES_URL }}
          NEXT_PUBLIC_MAP_FONTS_URL: ${{ vars.NEXT_PUBLIC_MAP_FONTS_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
